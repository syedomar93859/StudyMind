<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>StudyMind | Login & Register</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- the 3 lines above load the inter font from google fonts -->
     
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/login.css">
    <script type="module" src="js/login.js"></script>
</head>
<body class="login-page">
    <div class = "wrapper">
        <div class="form-header">
            <div class="titles">
                <div class="title-login">
                    Login
                </div>
                <div class="title-register">
                    Register
                </div>
            </div>
            </div>

            <!-- login form -->
            <form action="#" class="login-form" autocomplete="off">
                <div class = "input-box">
                    <input type="text" class="input-field" id="log-email" required>
                    <label for="log-email" class="label">Email</label>
                    <i class="bx bx-envelope icon"></i>
                </div>
                <div class = "input-box">
                    <input type="password" class="input-field" id="log-pass" required>
                    <label for="log-pass" class="label">Password</label>
                    <i class="bx bx-lock-alt icon"></i>
                </div>
                <div class="form-cols">
                    <div class="col-1"></div>
                    <div class="col-2">
                        <a href="#">Forgot Password</a>
                    </div>
                </div>
                <div class="input-box">
                    <button class="btn-submit" id="signInBtn">Sign In <i class="bx bx-log-in"></i>
                    </button>
                </div>
                <div class="switch-form">
                <span>Don't have an account? <a href="#" id="goToRegister">Register</a></span>
                </div>
            </form>

            <!-- register form -->
            <form action="#" class="register-form" autocomplete="off">
                <div class = "input-box">
                    <input type="text" class="input-field" id="reg-name" required>
                    <label for="reg-name" class="label">Username</label>
                    <i class="bx bx-user icon"></i>
                </div>
                <div class = "input-box">
                    <input type="text" class="input-field" id="reg-email" required>
                    <label for="reg-email" class="label">Email</label>
                    <i class="bx bx-envelope icon"></i>
                </div>
                <div class = "input-box">
                    <input type="password" class="input-field" id="reg-pass" required>
                    <label for="reg-pass" class="label">Password</label>
                    <i class="bx bx-lock-alt icon"></i>
                </div>
                <div class="form-cols">
                    <div class="col-1">
                        <input type="checkbox" id="agree">
                        <label for="agree"> I agree to terms & conditions</label>
                    </div>

                    <div class="col-2">
                    </div>
                </div>
                <div class="input-box">
                    <button class="btn-submit" id="signUpBtn">Sign Up <i class="bx bx-log-out"></i>
                    </button>
                </div>
                <div class="switch-form">
                <span>Already have an account? <a href="#" id="goToLogin">Login</a></span>
                </div>
            </form>
    </div>
</body>
</html>
