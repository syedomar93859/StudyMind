
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src= "main.js" defer ></script>
</head>

<body style="text-align:center;">
    <h1>StudyMind
        <span class="tooltip">
        ⓘ
            <span class="tooltiptext">
                This is a tool to ask an AI to learn, review and practice for any topic you want to know more about.
            </span>
        </span>
    </h1>
    <p>What do you want to ask?</p>
    <textarea name="text" id="submission" placeholder="Some text..." ></textarea>
    <br><br>
    <button id ="submit">Submit</button>
    <br>
    <p>AI Response:</p>
    <div class="response">
        <p>StudyMind will respond here...</p>
    </div>

    
</body>
</html>
