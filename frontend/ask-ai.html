
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>StudyMind | Ask AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- the 3 lines above load the inter font from google fonts -->
     
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/ai.css">
    <script type="module" src="js/ai.js"></script>
</head>

<body style="text-align:center;">
    <div class="navigation">
        <p>
            <span id="clickable-text">StudyMind</span>
        </p>

        <div class="nav-right">
            <span id="account-name"></span>

            <div class="nav-buttons">
                <button class="main-button" id="go-to-ai-button">
                    Ask AI
                </button>

                <button class="main-button" id="go-to-notes-button">
                    Notes
                </button>

                <button class="settings" id="go-to-settings-button"> 
                        <i class="bx bx-cog" ></i>
                </button>
            </div>


        </div>
    </div>

    <!-- <button type="button" onclick="goToHomePage();">Home</button> -->

    <h1>Ask AI
        <span class="tooltip">
        ⓘ
            <span class="tooltiptext">
                This is a tool to ask an AI to learn, review and practice for any topic you want to know more about.
            </span>
        </span>
    </h1>

    <p>What do you want to ask?</p>
    <textarea name="text" id="submission" placeholder="Some text..." ></textarea>
    <br><br>
    
    <button id ="submit" class="submit-btn">Submit</button>
    <br>
    <p>AI Response:</p>
    <div class="response">
        <p>StudyMind will respond here...</p>
    </div>

    <div id ="customAlert" class="alert-box">
        <div class="alert-content">
            <button id="closeAlert" class="alert-close">
                <i class="bx bx-x"></i>
            </button>
            
            <h2 id="alertTitle">Empty Input</h2>
            <p id="alertMessage">The input box is empty.</p>
            <button id="confirmAlert">Ok</button>
        </div>
    </div>

    

    
</body>
</html>
