<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>StudyMind | Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- the 3 lines above load the inter font from google fonts -->
     
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/notes.css">
    <script type="module" src="js/notes.js"></script>
</head>
<body>
    <!-- <button class="test-button" id="send-button" type="button" onclick="sendInfo();">
                Send
    </button> -->

    <!-- <input type="text" id="title" class="testing" placeholder="Enter title" required> -->

    <!-- <button class="test-button" id="take-button" type="button" onclick="getInfo();">
                Take
    </button>


    <p id="result"></p> -->

    <!-- <input type="text" id="title" class="testing" placeholder="Enter title" required>
    <input type="text" id="content" class="testing" placeholder="Enter content" required> -->

    <div class="navigation">
        <p>
            <span id="clickable-text">StudyMind</span>
        </p>

        <div class="nav-right">
            <span id="account-name"></span>

            <div class="nav-buttons">
                <button class="main-button" id="go-to-ai-button">
                    Ask AI
                </button>

                <button class="main-button" id="go-to-notes-button">
                    Notes
                </button>

                <button class="settings" id="go-to-settings-button"> 
                        <i class="bx bx-cog" ></i>
                </button>
            </div>


        </div>
    </div>

    <header>
        <h1>
            Notes
        </h1>
        <div>
            <button class="add-note-btn" id="addNoteBtn">+ Add Note</button>
            <!-- <button id ="themeToggleBtn" class="theme-toggle-btn">Put An Icon Here</button> -->
        </div>
    </header>
    <main id="notesContainer" class="notes-grid">

    </main>

    <dialog id="noteDialog" class = "full-dialog">
        <div class="dialog-content">

            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">
                    Add New Note
                </h2>
                <button class="close-btn" id="closeBtn">x</button>
            </div>

            <form id="noteForm">
                <div class = "form-group">
                    <label for="noteTitle" class="form-label">Title</label>
                    <input type="text" id="noteTitle" class="form-input" placeholder="Enter note title" required>
                </div>

                <div class = "form-group">
                    <label for="noteContent" class="form-label">Content</label>
                    <textarea id="noteContent" class="form-textarea" placeholder="Write your note here..." required></textarea>
                </div>

                <div class ="dialog-actions">
                    <button class="cancel-btn" id="cancelBtn">Cancel</button>
                    
                    <button type="submit" class="save-btn">
                        Save Note
                    </button>
                </div>
            </form>
        </div>
    </dialog>
    
</body>
</html>
