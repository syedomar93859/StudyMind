<!DOCTYPE html>
<!-- This is a modern html HTML5 document -->

<html lang="en">
<!-- lang="en" means the page language is English -->

<head>
    <!-- <head> contains information about the page and is not visible page content -->

    <meta charset="UTF-8">
    <!-- this tells the browser ow text is encoded -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- this tells the browser make the webpage width match the device width and use normal zoom scaling -->
    <!-- important for phones/mobile devices -->

    <title>API Fetching</title>
    <!-- this sets browser tab name -->


    <script src= "main.js" defer ></script>
    <!-- connect with the main.js file to this html file -->

</head>
<body>
    <!-- this is the visible content of the webpage -->
    
    <h1>Own Data</h1>
    <!-- large heading text -->
    
    <input type="text" id="input"/>
    <!-- creates a text box, also id="input", this allows JavaScript to find this element later -->
    
    <button id ="button">GET DATA</button>
    <!-- creates a clickable button, id="button" lets JavaScript locate the button -->
    
    <h1> Outside Data</h1>
    <!-- important for phones/mobile devices -->
    <input type="text" id="input2"/>
    <!-- important for phones/mobile devices -->
    <button id ="button2">GET DATA</button>
    <!-- important for phones/mobile devices -->
</body>
</html>
